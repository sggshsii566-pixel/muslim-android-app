name: muslim
on:
  workflow_dispatch:
  push:
    paths: ['go.txt']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir w && cat parts/b64.* | base64 -d > bundle.tgz && echo "8ffafd80a32156f9d69b2bb0ed4c2b1581a684db133d2b24bc42921186c47310  bundle.tgz" | sha256sum -c - && tar xzf bundle.tgz -C w
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: build
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/w/ks.jks"
          export KS_FILE="$GITHUB_WORKSPACE/w/ks.jks"
          cd w && gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
          rm -f "$KS_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: w
          path: |
            w/app/build/outputs/apk/release/*.apk
            w/ci
  emu:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: w, path: w }
      - run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            bash w/ci/run.sh $(ls w/app/build/outputs/apk/release/*.apk) out
      - name: sheets
        if: always()
        run: |
          mkdir -p pub
          for d in noloc loc; do
            ls out/$d/*.png | split -l 8 -d - chunk_$d.
            for c in chunk_$d.*; do montage -label '%t' -pointsize 14 -tile 4x2 -geometry 300x666+3+3 $(cat $c) pub/${d}_${c##*.}.png; done
            cp out/$d/steps.txt pub/steps_$d.txt; cp out/$d/crashes.txt pub/crashes_$d.txt
          done
          cp out/fatal.txt pub/ || true
          ls pub
      - name: push sheets
        if: always()
        run: |
          cd pub && git init -q && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b shots-api${{ matrix.api }} && git add . && git commit -qm sheets
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} shots-api${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-api${{ matrix.api }}
          path: out
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: w, path: w }
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd w/app/build/outputs/apk/release && ls
          sha256sum *.apk > SHA256.txt
          gh release create muslim-run${{ github.run_number }} *.apk SHA256.txt --repo ${{ github.repository }} --prerelease --title "MUSLIM 1.0.0 UNTESTED (run ${{ github.run_number }})" --notes "UNTESTED build. It compiles and unit tests pass, but no one has run it on a device yet. Emulator results will appear on the shots-api34 and shots-api35 branches if CI emulators boot."
